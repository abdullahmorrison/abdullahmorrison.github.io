<!-- Two overlapping panes: what these all are, and one in each product's colour. The
     lower pane is cut away where the upper one covers it, so the overlap reads as depth
     rather than mud at 16px. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <mask id="cut">
    <rect width="32" height="32" fill="#fff"/>
    <rect x="11.4" y="11.4" width="21.6" height="21.6" rx="6" fill="#000"/>
  </mask>
  <rect x="2" y="2" width="18" height="18" rx="4.5" fill="#e0342a" mask="url(#cut)"/>
  <rect x="13.4" y="13.4" width="16.6" height="16.6" rx="4.5" fill="#9a6cff"/>
</svg>
